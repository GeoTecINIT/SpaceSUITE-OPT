<div class="flex flex-column gap-4 w-19rem mx-2">
  <div class="flex flex-column">
    <h2 class="mt-3 mb-2">Filters</h2>

    <p-divider class="m-0" />
  </div>

  <ng-container *ngIf="logged">
    <div class="flex">
      <p-selectbutton
        class="custom-togglebutton"
        [(ngModel)]="visibilityFilter"
        [options]="visibilityFilterOptions"
        [allowEmpty]="false"
        optionLabel="label"
        optionValue="value"
        (ngModelChange)="updateVisibilityFilter()"
        [disabled]="loading"
        size="small"
      >
        <ng-template #item let-item>
          <div class="flex flex-column">
            <i [class]="item.icon"></i>

            {{ item.label }}
          </div>
        </ng-template>
      </p-selectbutton>
    </div>
  </ng-container>

  <div class="flex flex-column">
    Search by {{ searchOption }}

    <p-inputgroup class="w-20rem">
      <input
        class="custom-input"
        type="text"
        pInputText
        [(ngModel)]="searchValue"
        (ngModelChange)="updateSearchValue()"
        placeholder="Search"
        [disabled]="loading"
      />

      <p-inputgroup-addon [class]="loading ? 'disabled-addon' : ''">
        <p-button
          class="input-button"
          icon="pi pi-chevron-down"
          severity="secondary"
          variant="text"
          (click)="menu.toggle($event)"
          [disabled]="loading"
        />
      </p-inputgroup-addon>
    </p-inputgroup>

    <p-menu #menu styleClass="!min-w-fit" [model]="searchOptions" popup>
      <ng-template #item let-item>
        <a
          pRipple
          class="flex items-center p-menu-item-link"
          (click)="updateSearchOption(item.label)"
        >
          <i
            class="w-1rem"
            [ngClass]="item.label === searchOption ? 'pi pi-check' : ''"
          ></i>

          <span class="ml-2">{{ item.label }}</span>
        </a>
      </ng-template>
    </p-menu>
  </div>

  <ng-container
    *ngFor="let option of multiSelectOptions; trackBy: trackByLabel"
  >
    <div>
      <div class="flex align-items-center">
        {{ option.label }}

        <i
          *ngIf="option.tooltip"
          [pTooltip]="option.tooltip"
          tooltipPosition="right"
          class="ml-2 pi pi-info-circle"
        ></i>
      </div>

      <p-multiselect
        [options]="getMultiselectOptions(option)"
        [(ngModel)]="option.selection"
        (ngModelChange)="updateSelectOptions()"
        placeholder="Select {{ option.label }}"
        class="mt-1 w-20rem custom-multiselect"
        panelStyleClass="max-w-20rem"
        [disabled]="loading"
        [showClear]="true"
        (onClear)="clearOptions(option.label)"
        [maxSelectedLabels]="1"
        optionValue="value"
        optionLabel="id"
      />
    </div>
  </ng-container>

  <div class="max-w-20rem">
    <bokModal
      [allowKnowledgeAreas]="true"
      [disabled]="loading"
      [label]="'Filter by Knowledge / BoK Concept'"
      [selectedConcepts]="bokConcepts"
      (selectedConceptsChange)="bokConceptsChange.emit($event)"
    ></bokModal>
  </div>
</div>
